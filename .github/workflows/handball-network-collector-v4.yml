name: Plot207 Handball Daily Predictions

# 06:20 UTC = 07:20 WAT (Nigeria). Handball runs independently every day.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-handball-daily-predictions
  cancel-in-progress: false

jobs:
  handball-refresh:
    name: Refresh Handball Predictions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record Handball refresh start
        run: echo "SPORT_REFRESH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Capture Handball fixtures and publish snapshot
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo 'Missing GitHub secret SPORTYSOCIAL_LOGIN_ID' && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo 'Missing GitHub secret SPORTYSOCIAL_PASSWORD' && exit 1)
          node jobs/sporty-handball-network-collector.js

      - name: Verify fresh Handball snapshot
        env:
          SPORT_NAME: handball
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: node jobs/verify-sport-snapshot.js

      - name: Upload Handball diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-handball-v4
          path: handball-discovery-v2/
          if-no-files-found: ignore
          retention-days: 3
