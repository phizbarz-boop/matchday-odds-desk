name: Plot207 Handball Collector V4

# 06:05 UTC = 07:05 Nigerian time (WAT).
on:
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-handball-daily-collector
  cancel-in-progress: false

jobs:
  test-handball-v4:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture full Handball fixture metadata
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          node jobs/sporty-handball-network-collector.js

      - name: Upload Handball V4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-handball-v4
          path: handball-discovery-v2/
          if-no-files-found: ignore
          retention-days: 3
