name: Test SportyBet Handball Collector

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-sportybet-handball-collector
  cancel-in-progress: false

jobs:
  test-handball:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test dummy login and discover Handball fixtures
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          SPORTY_HANDBALL_MAX_EVENTS: '10'
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          node jobs/sporty-handball-test.js

      - name: Upload safe Handball discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-handball-discovery
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
