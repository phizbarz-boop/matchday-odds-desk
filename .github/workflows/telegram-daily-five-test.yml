name: Test Independent 5x Tickets
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: plot207-daily-five-test
  cancel-in-progress: false
jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate 5x B and 5x C only
        env:
          TELEGRAM_REQUEST_TIMEOUT_SECONDS: 10
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL || 'https://matchday-odds-desk.onrender.com' }}
        run: python3 jobs/telegram-picks-runner.py --endpoint daily-five-test
