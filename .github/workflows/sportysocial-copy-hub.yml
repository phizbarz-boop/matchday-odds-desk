name: SportySocial Copy Hub

on:
  workflow_dispatch:
  schedule:
    # Nigeria (WAT) is UTC+1: 07:00 and 19:00 WAT daily.
    - cron: '0 6,18 * * *'

permissions:
  contents: read

concurrency:
  group: sportysocial-copy-hub
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Collect SportySocial booking codes
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          COPY_HUB_SECRET: ${{ secrets.COPY_HUB_SECRET }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL }}
          SPORTYSOCIAL_MAX_PAGES: ${{ vars.SPORTYSOCIAL_MAX_PAGES }}
        run: node jobs/sportysocial-collector.js

      - name: Upload safe login diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sportysocial-login-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
