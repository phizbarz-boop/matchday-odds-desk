name: Plot207 Telegram Hourly QC and Live Picks

on:
  # Hourly automation now runs directly in the app server. Keep this workflow
  # only as an intentional manual trigger; do not add a second hourly clock.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-telegram-hourly-quick-cash
  cancel-in-progress: false

jobs:
  quick-cash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate four current sport QC tickets and Live All Sports 85%
        env:
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          GH_EVENT_NAME: ${{ github.event_name }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL || 'https://matchday-odds-desk.onrender.com' }}
        run: |
          test -n "$TELEGRAM_JOB_SECRET" || (echo 'Missing GitHub secret TELEGRAM_JOB_SECRET' && exit 1)
          if [ "$GH_EVENT_NAME" = 'workflow_dispatch' ]; then MODE=manual; else MODE=scheduled; fi
          curl --fail-with-body --show-error --silent --max-time 780 \
            -X POST "$MATCHDAY_BASE_URL/api/telegram/quick-cash" \
            -H 'Content-Type: application/json' \
            -H "x-telegram-job-secret: $TELEGRAM_JOB_SECRET" \
            -H "x-matchday-run-mode: $MODE" \
            -H "x-matchday-run-id: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --data '{}' -w '\nHTTP_STATUS:%{http_code}\n'
