name: Matchday Telegram Auto Picks

# SINGLE daily run: 07:25 UTC = 08:25 WAT (Nigeria). No NY timezone or evening cron.
on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: matchday-telegram-auto-picks
  cancel-in-progress: false

jobs:
  send-picks:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '25 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate and send Telegram codes once for WAT date
        env:
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          GH_EVENT_NAME: ${{ github.event_name }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$TELEGRAM_JOB_SECRET" || (echo 'Missing GitHub secret TELEGRAM_JOB_SECRET' && exit 1)
          if [ "$GH_EVENT_NAME" = 'workflow_dispatch' ]; then MODE=manual; else MODE=scheduled; fi
          echo "Telegram run type: $MODE; UTC clock: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          curl --fail-with-body --show-error --silent --max-time 1080 \
            -X POST "$MATCHDAY_BASE_URL/api/telegram/daily-picks" \
            -H 'Content-Type: application/json' \
            -H "x-telegram-job-secret: $TELEGRAM_JOB_SECRET" \
            -H "x-matchday-run-mode: $MODE" \
            --data '{}' -w '\nHTTP_STATUS:%{http_code}\n'
