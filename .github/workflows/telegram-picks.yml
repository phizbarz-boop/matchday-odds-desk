name: Matchday Telegram Auto Picks

# Morning cron and manual runs send SAFE. Next-12-hours picks have their
# own twice-daily scheduler and manual workflow.
on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: matchday-telegram-auto-picks
  cancel-in-progress: false

jobs:
  send-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate and send SAFE (manual runs may repeat anytime)
        env:
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          GH_EVENT_NAME: ${{ github.event_name }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL || 'https://matchday-odds-desk.onrender.com' }}
        run: |
          python3 jobs/telegram-picks-runner.py --endpoint daily-picks
