name: Plot207 Handball Network Collector V2

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-handball-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture Handball fixture network data
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          node jobs/sporty-handball-network-collector.js

      - name: Upload Handball V2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-handball-v2
          path: handball-discovery-v2/
          if-no-files-found: ignore
          retention-days: 3
