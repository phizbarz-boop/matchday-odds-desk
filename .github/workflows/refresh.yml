name: Daily Predictions Refresh

# Cron is UTC; Nigeria is UTC+1 year-round. Only ONE automatic refresh at 07:00 WAT.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-core-daily-refresh
  cancel-in-progress: false

jobs:
  core-refresh:
    name: Football + Basketball + Ice Hockey
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start daily refresh (UTC schedule, WAT server guard)
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$REFRESH_SECRET" || (echo 'Missing GitHub secret REFRESH_SECRET' && exit 1)
          echo "REFRESH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          if [ "$GH_EVENT_NAME" = 'workflow_dispatch' ]; then MODE=manual; else MODE=scheduled; fi
          curl --fail-with-body --show-error --silent --max-time 120 \
            -X POST "$MATCHDAY_BASE_URL/api/refresh" \
            -H "X-Refresh-Secret: $REFRESH_SECRET" \
            -H "x-matchday-run-mode: $MODE" \
            -H 'Content-Type: application/json' \
            --data '{}' -w '\nHTTP_STATUS:%{http_code}\n'

      - name: Verify updated predictions were persisted
        env:
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
          REFRESH_WAIT_MS: '1320000'
        run: node jobs/wait-for-predictions.js
