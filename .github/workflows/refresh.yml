name: Daily Predictions Refresh

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 07:00 WAT (Africa/Lagos)
  workflow_dispatch: {}    # allows manually running all sports from Actions

permissions:
  contents: read

jobs:
  core-refresh:
    name: Football + Basketball + Ice Hockey
    runs-on: ubuntu-latest
    steps:
      - name: Refresh core prediction feeds
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: |
          test -n "$REFRESH_SECRET" || (echo "Missing GitHub secret REFRESH_SECRET" && exit 1)
          curl --fail-with-body --show-error --silent \
            -X POST "https://matchday-odds-desk.onrender.com/api/refresh" \
            -H "X-Refresh-Secret: $REFRESH_SECRET" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            --max-time 120

  handball-refresh:
    name: Handball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refresh Handball fixtures and markets
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          test -n "$TELEGRAM_JOB_SECRET" || (echo "Missing GitHub secret TELEGRAM_JOB_SECRET" && exit 1)
          node jobs/sporty-handball-network-collector.js

      - name: Upload Handball diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-handball-refresh
          path: handball-discovery-v2/
          if-no-files-found: ignore
          retention-days: 3

  volleyball-refresh:
    name: Volleyball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refresh Volleyball fixtures and markets
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          test -n "$TELEGRAM_JOB_SECRET" || (echo "Missing GitHub secret TELEGRAM_JOB_SECRET" && exit 1)
          node jobs/sporty-volleyball-network-collector.js

      - name: Upload Volleyball diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-volleyball-refresh
          path: volleyball-discovery-v1/
          if-no-files-found: ignore
          retention-days: 3

  tennis-refresh:
    name: Tennis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refresh Tennis fixtures and markets
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
          SPORTYBET_TENNIS_MAX_SCANS: '80'
          SPORTYBET_TENNIS_STABLE_SCANS: '5'
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          test -n "$TELEGRAM_JOB_SECRET" || (echo "Missing GitHub secret TELEGRAM_JOB_SECRET" && exit 1)
          node jobs/sporty-tennis-network-collector.js

      - name: Upload Tennis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-tennis-refresh
          path: tennis-discovery-v1/
          if-no-files-found: ignore
          retention-days: 3
