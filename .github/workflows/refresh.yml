name: Daily Predictions Refresh - All 6 Sports

# ONE UTC cron: 06:20 UTC = 07:20 WAT. All four independent jobs start in parallel in this workflow.
# The collector-specific workflows are MANUAL recovery only, preventing duplicate scheduled calls.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-all-six-sports-daily-refresh
  cancel-in-progress: false

jobs:
  core-refresh:
    name: Football + Basketball + Ice Hockey
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start core daily refresh (UTC schedule, WAT server guard)
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$REFRESH_SECRET" || (echo 'Missing GitHub secret REFRESH_SECRET' && exit 1)
          echo "REFRESH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          if [ "$GH_EVENT_NAME" = 'workflow_dispatch' ]; then MODE=manual; else MODE=scheduled; fi
          curl --fail-with-body --show-error --silent --max-time 120 \
            -X POST "$MATCHDAY_BASE_URL/api/refresh" \
            -H "X-Refresh-Secret: $REFRESH_SECRET" \
            -H "x-matchday-run-mode: $MODE" \
            -H 'Content-Type: application/json' \
            --data '{}' -w '\nHTTP_STATUS:%{http_code}\n'

      - name: Verify updated predictions were persisted
        env:
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
          REFRESH_WAIT_MS: '1320000'
        run: node jobs/wait-for-predictions.js

  handball-refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record Handball collection start
        run: echo "SPORT_REFRESH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Capture full Handball fixture metadata
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          node jobs/sporty-handball-network-collector.js

      - name: Confirm new Handball outcomes are available on website API
        env:
          SPORT_NAME: handball
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: node jobs/verify-sport-snapshot.js

      - name: Upload Handball V4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-handball-v4
          path: handball-discovery-v2/
          if-no-files-found: ignore
          retention-days: 3

  volleyball-refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record Volleyball collection start
        run: echo "SPORT_REFRESH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Capture Volleyball fixtures and publish snapshot
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          test -n "$TELEGRAM_JOB_SECRET" || (echo "Missing GitHub secret TELEGRAM_JOB_SECRET" && exit 1)
          node jobs/sporty-volleyball-network-collector.js

      - name: Confirm new Volleyball outcomes are available on website API
        env:
          SPORT_NAME: volleyball
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: node jobs/verify-sport-snapshot.js

      - name: Upload Volleyball diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-volleyball-v1
          path: volleyball-discovery-v1/
          if-no-files-found: ignore
          retention-days: 3

  tennis-refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record Tennis collection start
        run: echo "SPORT_REFRESH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Capture Tennis fixtures and publish snapshot
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          test -n "$TELEGRAM_JOB_SECRET" || (echo "Missing GitHub secret TELEGRAM_JOB_SECRET" && exit 1)
          SPORTYBET_TENNIS_MAX_SCANS=80 SPORTYBET_TENNIS_STABLE_SCANS=5 node jobs/sporty-tennis-network-collector.js

      - name: Confirm new Tennis outcomes are available on website API
        env:
          SPORT_NAME: tennis
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: node jobs/verify-sport-snapshot.js

      - name: Upload Tennis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-tennis-v4
          path: tennis-discovery-v4/
          if-no-files-found: ignore
          retention-days: 3
