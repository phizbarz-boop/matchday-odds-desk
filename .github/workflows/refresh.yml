name: Plot207 All Sports Daily Predictions

on:
  workflow_dispatch:
  schedule:
    # Nigeria (WAT) is UTC+1: 07:20 WAT daily.
    - cron: '20 6 * * *'

permissions:
  contents: read

concurrency:
  group: plot207-all-sports-daily-predictions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Refresh and verify all sports
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$REFRESH_SECRET" || (echo "Missing GitHub secret REFRESH_SECRET" && exit 1)
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo "Missing GitHub secret SPORTYSOCIAL_LOGIN_ID" && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo "Missing GitHub secret SPORTYSOCIAL_PASSWORD" && exit 1)
          test -n "$TELEGRAM_JOB_SECRET" || (echo "Missing GitHub secret TELEGRAM_JOB_SECRET" && exit 1)
          node jobs/all-sports-daily-refresh.js

      - name: Upload safe collector diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: all-sports-refresh-diagnostics
          path: |
            handball-discovery-v2/
            volleyball-discovery-v1/
            tennis-discovery-v4/
          if-no-files-found: ignore
          retention-days: 3
