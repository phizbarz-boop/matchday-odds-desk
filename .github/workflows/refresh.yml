name: Plot207 Public SportyBet Prediction Cache

on:
  # The app server refreshes at 06:30, 12:30 and 17:30 WAT.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-public-sportybet-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start public fixture and market cache refresh
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL || 'https://matchday-odds-desk.onrender.com' }}
        run: |
          test -n "$REFRESH_SECRET" || (echo 'Missing GitHub secret REFRESH_SECRET' && exit 1)
          curl --fail-with-body --show-error --silent --max-time 120 \
            -X POST "$MATCHDAY_BASE_URL/api/refresh" \
            -H 'Content-Type: application/json' \
            -H "x-refresh-secret: $REFRESH_SECRET" \
            -H 'x-matchday-run-mode: manual' --data '{}'
          curl --fail-with-body --show-error --silent --max-time 30 \
            "$MATCHDAY_BASE_URL/api/sportybet/public-cache/status"
