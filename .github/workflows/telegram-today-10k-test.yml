name: Test Today 100,000x Pick
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: plot207-today-10k-test
  cancel-in-progress: false
jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate up to one Today 100,000x ticket
        env:
          TELEGRAM_REQUEST_TIMEOUT_SECONDS: 10
          TELEGRAM_POLL_MAX_SECONDS: 260
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL || 'https://matchday-odds-desk.onrender.com' }}
        run: python3 jobs/telegram-picks-runner.py --endpoint today-10k-test
