name: Plot207 Volleyball Daily Predictions

# 06:25 UTC = 07:25 WAT (Nigeria). Volleyball runs independently every day.
on:
  schedule:
    - cron: '25 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-volleyball-daily-predictions
  cancel-in-progress: false

jobs:
  volleyball-refresh:
    name: Refresh Volleyball Predictions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record Volleyball refresh start
        run: echo "SPORT_REFRESH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Capture Volleyball fixtures and publish snapshot
        env:
          SPORTYSOCIAL_LOGIN_ID: ${{ secrets.SPORTYSOCIAL_LOGIN_ID }}
          SPORTYSOCIAL_PASSWORD: ${{ secrets.SPORTYSOCIAL_PASSWORD }}
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: |
          test -n "$SPORTYSOCIAL_LOGIN_ID" || (echo 'Missing GitHub secret SPORTYSOCIAL_LOGIN_ID' && exit 1)
          test -n "$SPORTYSOCIAL_PASSWORD" || (echo 'Missing GitHub secret SPORTYSOCIAL_PASSWORD' && exit 1)
          test -n "$TELEGRAM_JOB_SECRET" || (echo 'Missing GitHub secret TELEGRAM_JOB_SECRET' && exit 1)
          node jobs/sporty-volleyball-network-collector.js

      - name: Verify fresh Volleyball snapshot
        env:
          SPORT_NAME: volleyball
          MATCHDAY_BASE_URL: https://matchday-odds-desk.onrender.com
        run: node jobs/verify-sport-snapshot.js

      - name: Upload Volleyball diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-volleyball-v1
          path: volleyball-discovery-v1/
          if-no-files-found: ignore
          retention-days: 3
