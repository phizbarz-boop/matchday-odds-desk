name: Matchday Daily Slip Settlement Check

on:
  workflow_dispatch:
  schedule:
    # Settlement reconciliation at 01:00, 02:00, 03:00 and 05:00 WAT.
    # GitHub cron is UTC: 00:00, 01:00, 02:00 and 04:00 UTC.
    # This allows SportyBet/Parse.bot extra time to update late bookingSettlement values.
    - cron: "0 0,1,2,4 * * *"

concurrency:
  group: matchday-telegram-settlement-check
  cancel-in-progress: false

jobs:
  check-settlements:
    runs-on: ubuntu-latest
    steps:
      - name: Settle previous WAT matchday Auto Pick tickets
        env:
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
        run: |
          test -n "$TELEGRAM_JOB_SECRET" || (echo "Missing GitHub secret TELEGRAM_JOB_SECRET" && exit 1)
          curl --fail-with-body --show-error --silent --max-time 600 \
            -X POST "https://matchday-odds-desk.onrender.com/api/telegram/check-settlements" \
            -H "Content-Type: application/json" \
            -H "x-telegram-job-secret: $TELEGRAM_JOB_SECRET" \
            --data '{}'
