name: Plot207 Telegram Next 12 Hours Picks

on:
  # Automatic 07:00 and 18:00 WAT sends are owned by the app server.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-telegram-next-12h
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate six next-12-hours target tickets
        env:
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL || 'https://matchday-odds-desk.onrender.com' }}
        run: |
          test -n "$TELEGRAM_JOB_SECRET" || (echo 'Missing GitHub secret TELEGRAM_JOB_SECRET' && exit 1)
          curl --fail-with-body --show-error --silent --max-time 780 \
            -X POST "$MATCHDAY_BASE_URL/api/telegram/next-12h-picks" \
            -H 'Content-Type: application/json' \
            -H "x-telegram-job-secret: $TELEGRAM_JOB_SECRET" \
            -H 'x-matchday-run-mode: manual' \
            -H "x-matchday-run-id: $GITHUB_RUN_ID" \
            --data '{}'
