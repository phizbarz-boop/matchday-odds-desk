name: Plot207 Telegram Next 12 Hours Picks

on:
  # Wake-up fallback shares the app scheduler slot to prevent duplicate sends.
  schedule:
    - cron: '5 6,17 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plot207-telegram-next-12h
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate six next-12-hours target tickets
        env:
          TELEGRAM_JOB_SECRET: ${{ secrets.TELEGRAM_JOB_SECRET }}
          MATCHDAY_BASE_URL: ${{ vars.MATCHDAY_BASE_URL || 'https://matchday-odds-desk.onrender.com' }}
        run: |
          python3 jobs/telegram-picks-runner.py --endpoint next-12h-picks
